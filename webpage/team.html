            </div>
        </header>
    </main>
    <footer></footer>

    <script>
        // Load the header
        fetch('./header.html')
            .then(res => res.text())
            .then(html => {
                const headerPlaceholder = document.querySelector('#header-placeholder');
                headerPlaceholder.innerHTML = html;
                const scripts = headerPlaceholder.querySelectorAll('script');
                scripts.forEach((script) => {
                    const newScript = document.createElement('script');
                    newScript.text = script.textContent;
                    document.body.appendChild(newScript);
                });

                // Dropdown support for mobile and desktop
                document.querySelectorAll('.dropdown > a').forEach(dropdownToggle => {
                    dropdownToggle.addEventListener('click', function(e) {
                        // Only activate on touch devices or small screens
                        if (window.innerWidth <= 900 || 'ontouchstart' in window) {
                            e.preventDefault();
                            const dropdownContent = this.parentElement.querySelector('.dropdown-content');
                            if (dropdownContent.style.display === 'block') {
                                dropdownContent.style.display = '';
                            } else {
                                // Hide all other dropdowns
                                document.querySelectorAll('.dropdown-content').forEach(dc => dc.style.display = 'none');
                                dropdownContent.style.display = 'block';
                            }
                        }
                    });
                });

                // Close dropdowns when clicking outside (mobile)
                document.addEventListener('click', function(e) {
                    if (window.innerWidth <= 900 || 'ontouchstart' in window) {
                        if (!e.target.closest('.dropdown')) {
                            document.querySelectorAll('.dropdown-content').forEach(dc => dc.style.display = 'none');
                        }
                    }
                });
            });
            
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.querySelector('footer').innerHTML = data;
            });
        // Set the document title
        document.title = document.body.getAttribute('data-title') + ' | PADME';
    </script>
</body>
</html>
