<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>

<body data-title="News">
    <main>
        <header>
            <div id="header-placeholder"></div>
            <div class="news-text-container">
                <h1>News</h1>
            </div>
        </header>
        <div class="news-columns-wrapper">
            <div class="news-column" id="publications-column">
                <h2>Publications</h2>
                <div class="news-items" id="publications-list">
                    <!-- News items will be inserted here by JS -->
                </div>
                <div class="pagination" id="publications-pagination"></div>
            </div>
            <div class="news-column" id="activities-column">
                <h2>Activities</h2>
                <div class="news-items" id="activities-list">
                    <!-- News items will be inserted here by JS -->
                </div>
                <div class="pagination" id="activities-pagination"></div>
            </div>
        </div>
    </main>
    <footer></footer>
    <script>
        // Load the header
        fetch('header.html')
            .then(res => res.text())
            .then(html => {
                const headerPlaceholder = document.querySelector('#header-placeholder');
                headerPlaceholder.innerHTML = html;

                // 🔥 This executes any <script> inside the fetched HTML
                const scripts = headerPlaceholder.querySelectorAll('script');
                scripts.forEach((script) => {
                    const newScript = document.createElement('script');
                    newScript.text = script.textContent;
                    document.body.appendChild(newScript);
                });
            });

        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.querySelector('footer').innerHTML = data;
            });
        // Set the document title
        document.title = document.body.getAttribute('data-title') + ' | PADME';

        // Example news data
        const publications = [
            { title: "Premeal Whey Protein Lowers Postprandial Blood Glucose in Women With Gestational Diabetes Mellitus: A Randomized, Crossover Clinical Trial", content: "Smedegaard S, Kampmann U, Ovesen PG, Suder LB, Knudsen JH, Wegener G, Brunsgaard LH, Rittig N. Diabetes Care. 2025 Jun 1;48(6):1022-1031. doi: 10.2337/dc24-2831. PMID: 40261798." },
            { title: "Shortcut to the needle in the haystack? Screening for maturity onset diabetes of the young in a population of women with gestational diabetes", content: "Knorr S, Knudsen LL, Madsen AL, Madsen LR, Mortensen L, Thomsen HH, Sørensen LP, Ovesen PG, Fulgsang J, Kampmann U. Diabet Med. 2025 May;42(5):e70021. doi: 10.1111/dme.70021. Epub 2025 Mar 7. PMID: 40051305." },
            { title: "Breastfeeding and infant growth in relation to childhood overweight - a longitudinal cohort study", content: "Leth-Møller M, Kampmann U, Hede S, Ovesen PG, Hulman A, Knorr S. Am J Clin Nutr. 2025 Apr;121(4):835-842. doi: 10.1016/j.ajcnut.2025.01.020. Epub 2025 Jan 23. PMID: 39863115." },
            { title: "Prepregnancy and Gestational Interventions to Prevent Childhood Obesity", content: "Kampmann U, Suder LB, Nygaard M, Geiker NRW, Nielsen HS, Almstrup K, Bruun JM, Magkos F, Ovesen J, Catalano P. J Clin Endocrinol Metab. 2024 Dec 18;110(1):e8-e18. doi: 10.1210/clinem/dgae724. PMID: 39401333." },
            { title: "Publication 4", content: "Summary of publication 4." }
        ];
        const activities = [
            { title: "The DPSG annual metting 2025", content: "Her skriver man en opsummering af aktiviteten." },
            { title: "5th Swedish Diabetes Summit", content: "Noget med at Ninna Lund Larsen var afsted." },
            { title: "PADME meetings in autumn semester 2025", content: "23.09.25 (PADME website workshop), 28.10.25 (Presentation of Research Year-project by Johanne Vase), 19.11.25 (Presentation of Research Year-project by Sandra Haugaard Christensen), 17.12.25 (LinkedIn: Tips and Best Practices led by Line Sahlholdt Hansen)" },
            { title: "PADME journal clubs in autumn semester 2025", content: "23.09.25 (Presenter: Tine Storebjerg Knudsen), 28.10.25 (Presenter: Line Sahlholdt Hansen), 19.11.25 (Presenter: Victoria Bøttker), 17.12.25 (Presenter: Louise Birk Suder)" },
        ];

        function renderNews(list, containerId, page, perPage) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            const start = (page - 1) * perPage;
            const end = start + perPage;
            list.slice(start, end).forEach(item => {
                const div = document.createElement('div');
                div.className = 'news-item';
                div.innerHTML = `<h3>${item.title}</h3><p>${item.content}</p>`;
                container.appendChild(div);
            });
        }

        function renderPagination(list, paginationId, currentPage, perPage, onPageChange) {
            const totalPages = Math.ceil(list.length / perPage);
            const pagination = document.getElementById(paginationId);
            pagination.innerHTML = '';
            if (totalPages <= 1) return;
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.className = i === currentPage ? 'active' : '';
                btn.onclick = () => onPageChange(i);
                pagination.appendChild(btn);
            }
        }

        // Pagination state
        let publicationsPage = 1;
        let activitiesPage = 1;
        const perPage = 3;

        function updatePublications(page) {
            publicationsPage = page;
            renderNews(publications, 'publications-list', publicationsPage, perPage);
            renderPagination(publications, 'publications-pagination', publicationsPage, perPage, updatePublications);
        }
        function updateActivities(page) {
            activitiesPage = page;
            renderNews(activities, 'activities-list', activitiesPage, perPage);
            renderPagination(activities, 'activities-pagination', activitiesPage, perPage, updateActivities);
        }

        // Initial render
        updatePublications(1);
        updateActivities(1);
    </script>
</body>
</html>
