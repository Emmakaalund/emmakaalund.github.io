<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles.css">
</head>
<body data-title="Contact">
    <header>
        <div id="header-placeholder"></div>
    </header>
    <main>
        <div class="contact-wrapper">
            <div class="contact-header">
                <h1>Premeal Whey Protein Lowers Postprandial Blood Glucose in Women With Gestational Diabetes Mellitus: A Randomized, Crossover Clinical Trial</h1>
            </div>
        </div>
        <div class="centered-container">
            Full text
        </div>
    </main>
    <footer>
    </footer>
    <script>
        // Load the header
        fetch('../header.html')
            .then(res => res.text())
            .then(html => {
                const headerPlaceholder = document.querySelector('#header-placeholder');
                headerPlaceholder.innerHTML = html;

                // 🔥 This executes any <script> inside the fetched HTML
                const scripts = headerPlaceholder.querySelectorAll('script');
                scripts.forEach((script) => {
                    const newScript = document.createElement('script');
                    newScript.text = script.textContent;
                    document.body.appendChild(newScript);
                });
            });

        fetch('../footer.html')
            .then(response => response.text())
            .then(data => {
                document.querySelector('footer').innerHTML = data;
            });
        // Set the document title
        document.title = document.body.getAttribute('data-title') + ' | PADME';
    </script>
</body>
</html>
